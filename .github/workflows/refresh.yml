name: Refresh catalog

on:
  schedule:
    - cron: '23 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      resume_upstream:
        description: Resume after investigating an upstream HTTP halt
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['publish.py', 'tests/**', '.github/workflows/**']

permissions:
  contents: read

concurrency:
  group: catalog-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      incomplete: ${{ steps.refresh.outputs.incomplete }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test publisher
        run: python -m unittest discover -s tests -v
      - name: Restore previous source state and publication blobs
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            state
            public
          key: catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: catalog-v1-
      - name: Refresh upstream and build publication
        id: refresh
        env:
          RESUME_UPSTREAM: ${{ inputs.resume_upstream || false }}
          PREVIOUS_BASE: https://neonindigo.com/satellite-catalog/
        run: |
          arguments=()
          if [ "$RESUME_UPSTREAM" = true ]; then
            arguments+=(--resume-upstream)
          fi
          python publish.py --previous-base "$PREVIOUS_BASE" "${arguments[@]}"
      - name: Save state including partial results and HTTP halt markers
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            state
            public
          key: catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Package the feed
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the feed
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report incomplete upstream coverage
        if: needs.build.outputs.incomplete == 'true'
        run: |
          echo 'Published retained data with incomplete upstream coverage. Inspect the build logs and manifest.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
